# Grafana Alloy (successor of Promtail) as a DaemonSet: tails every pod's
# logs through the Kubernetes API and ships them to Loki with namespace/pod/
# container/app labels; JSON logs from our services get level + model_version
# promoted to labels-light structured metadata.
controller:
  type: daemonset
  tolerations:
    - operator: Exists

alloy:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_workflows_argoproj_io_workflow"]
          target_label  = "workflow"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // JSON logs (ml-inference, trainer): extract level + model version
        stage.match {
          selector = "{namespace=~\"ml-serving|ml-training|ray\"}"
          stage.json {
            expressions = { level = "level", version = "version", model_version = "model_version" }
          }
          stage.labels {
            values = { level = "" }
          }
          stage.structured_metadata {
            values = { model_version = "", version = "" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
        external_labels = { cluster = sys.env("CLUSTER_NAME") }
      }
  extraEnv:
    - name: HOSTNAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: CLUSTER_NAME
      value: aiml

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
