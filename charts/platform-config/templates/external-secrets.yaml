# One cluster-wide store backed by AWS Secrets Manager. The External Secrets
# controller authenticates with its own IRSA role (scoped to <secretPrefix>/*).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
# Admin credentials, used only by the db-init Job
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: postgres-admin
  dataFrom:
    - extract:
        key: {{ .Values.secretPrefix }}/rds/master
{{- range .Values.postgres.apps }}
---
# Per-app credentials, copied into platform-system for the db-init Job
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-{{ . | replace "_" "-" }}
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: postgres-{{ . | replace "_" "-" }}
  dataFrom:
    - extract:
        key: {{ $.Values.secretPrefix }}/rds/{{ . }}
{{- end }}
---
# JupyterHub: full SQLAlchemy URL built from the secret (host = in-cluster alias)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jupyterhub-db
  namespace: {{ .Values.jupyterhub.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: jupyterhub-db
    template:
      data:
        url: "postgresql+psycopg2://{{ "{{ .username }}" }}:{{ "{{ .password }}" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ "{{ .dbname }}" }}?sslmode=require"
  dataFrom:
    - extract:
        key: {{ .Values.secretPrefix }}/rds/jupyterhub
{{- if .Values.jupyterhub.githubOauthSecret }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jupyterhub-github-oauth
  namespace: {{ .Values.jupyterhub.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: jupyterhub-github-oauth
  data:
    - secretKey: client_id
      remoteRef: { key: {{ .Values.secretPrefix }}/jupyterhub/github-oauth, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: {{ .Values.secretPrefix }}/jupyterhub/github-oauth, property: client_secret }
{{- end }}
---
# Argo Workflows archive: chart expects username/password keys in one secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argo-postgres
  namespace: {{ .Values.argo.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: argo-postgres
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secretPrefix }}/rds/argo_workflows, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secretPrefix }}/rds/argo_workflows, property: password }
{{- if .Values.monitoring.grafanaAdminSecret }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Values.monitoring.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: {{ .Values.secretPrefix }}/grafana/admin
{{- end }}
---
# Read-only Elasticsearch user for Grafana: same password lands in the ES file
# realm (logging ns) and in Grafana's datasource secret (monitoring ns).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: es-grafana-user
  namespace: logging
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: es-grafana-user
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ "{{ .username }}" }}"
        password: "{{ "{{ .password }}" }}"
        roles: viewer
  dataFrom:
    - extract:
        key: {{ .Values.secretPrefix }}/elasticsearch/grafana
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-es-credentials
  namespace: {{ .Values.monitoring.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: grafana-es-credentials
  data:
    - secretKey: password
      remoteRef: { key: {{ .Values.secretPrefix }}/elasticsearch/grafana, property: password }
