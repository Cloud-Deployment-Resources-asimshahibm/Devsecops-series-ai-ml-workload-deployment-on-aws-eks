# Idempotent: creates one LOGIN role + database per app on the shared RDS
# instance. Re-runs on every sync of this app (Argo CD PostSync hook) so a new
# entry in .Values.postgres.apps or a rotated password is applied automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-db-init
  namespace: platform-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - { name: PGHOST, value: {{ .Values.postgres.host | quote }} }
            - { name: PGPORT, value: {{ .Values.postgres.port | quote }} }
            - { name: PGSSLMODE, value: require }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-admin, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-admin, key: password } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-admin, key: dbname } }
            {{- range .Values.postgres.apps }}
            - name: PW_{{ . | upper }}
              valueFrom: { secretKeyRef: { name: postgres-{{ . | replace "_" "-" }}, key: password } }
            {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -t 5; do echo "waiting for postgres"; sleep 5; done
              {{- range .Values.postgres.apps }}
              echo "ensuring role/database {{ . }}"
              psql -v ON_ERROR_STOP=1 -v pw="$PW_{{ . | upper }}" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', '{{ . }}')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ . }}') \gexec
              ALTER ROLE "{{ . }}" WITH LOGIN PASSWORD :'pw';
              GRANT "{{ . }}" TO CURRENT_USER;
              SELECT format('CREATE DATABASE %I OWNER %I', '{{ . }}', '{{ . }}')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}') \gexec
              REVOKE ALL ON DATABASE "{{ . }}" FROM PUBLIC;
              SQL
              {{- end }}
              echo "done"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
