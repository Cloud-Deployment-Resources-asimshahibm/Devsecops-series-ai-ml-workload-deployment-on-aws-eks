{{- if .Values.security.apiKeys.enabled }}
# API keys for /v1/* — stored in Secrets Manager, never in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ml-inference.fullname" . }}-api-keys
  labels:
    {{- include "ml-inference.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: {{ include "ml-inference.fullname" . }}-api-keys
  data:
    - secretKey: api-keys
      remoteRef:
        key: {{ required "security.apiKeys.secretKey is required" .Values.security.apiKeys.secretKey }}
        property: keys
{{- end }}
---
{{- if .Values.security.networkPolicy.enabled }}
# Zero-trust: only the ALB (VPC addresses) and Prometheus may reach the API;
# egress limited to DNS and HTTPS (S3 / STS via VPC endpoints).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ml-inference.fullname" . }}
  labels:
    {{- include "ml-inference.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ml-inference.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.security.networkPolicy.vpcCidr }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
{{- end }}
