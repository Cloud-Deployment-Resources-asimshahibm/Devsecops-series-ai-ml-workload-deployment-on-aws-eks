# Fixtures for `kyverno test` — prove each policy blocks what it should and admits our workloads.
apiVersion: v1
kind: Pod
metadata:
  name: good-inference
  namespace: ml-serving
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: api
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/aiml/ml-inference:abc123def456
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { memory: 1Gi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-dockerhub-latest-root
  namespace: ml-serving
spec:
  containers:
    - name: api
      image: docker.io/library/python:latest
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-hostpath
  namespace: jupyterhub
spec:
  volumes:
    - name: host
      hostPath: { path: /var/run }
  containers:
    - name: nb
      image: quay.io/jupyter/scipy-notebook:python-3.11
---
apiVersion: v1
kind: Pod
metadata:
  name: ok-node-exporter
  namespace: monitoring
spec:
  hostNetwork: true
  containers:
    - name: ne
      image: quay.io/prometheus/node-exporter:v1.8.2
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-limits
  namespace: ray
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: worker
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/aiml/ml-ray:abc123def456
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
