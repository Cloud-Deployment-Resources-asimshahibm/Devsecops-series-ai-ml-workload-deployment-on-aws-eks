apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
spec:
  type: filebeat
  version: {{ .Values.version }}
  config:
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          hints.default_config:
            type: filestream
            id: kubernetes-container-logs-${data.kubernetes.pod.name}-${data.kubernetes.container.id}
            paths:
              - /var/log/containers/*-${data.kubernetes.container.id}.log
            parsers:
              - container: ~
            prospector.scanner.symlinks: true
    processors:
      - drop_event:
          when:
            not:
              or:
                {{- range .Values.filebeat.namespaces }}
                - equals: { kubernetes.namespace: {{ . | quote }} }
                {{- end }}
    output.logstash:
      hosts: ["{{ .Values.name }}-ls-beats.{{ .Release.Namespace }}.svc:5044"]
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        tolerations:
          - operator: Exists      # run on every node, incl. GPU-tainted ones
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              {{- toYaml .Values.filebeat.resources | nindent 14 }}
            volumeMounts:
              - { name: varlogcontainers, mountPath: /var/log/containers }
              - { name: varlogpods, mountPath: /var/log/pods }
              - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers }
        volumes:
          - name: varlogcontainers
            hostPath: { path: /var/log/containers }
          - name: varlogpods
            hostPath: { path: /var/log/pods }
          - name: varlibdockercontainers
            hostPath: { path: /var/lib/docker/containers }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: {{ .Release.Namespace }}
