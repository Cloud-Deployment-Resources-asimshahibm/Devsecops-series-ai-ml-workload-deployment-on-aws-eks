image:
  tag: "bootstrap"
  digest: ""

serviceAccount:
  roleArn: arn:aws:iam::__AWS_ACCOUNT_ID__:role/aiml-dev-ml-training

storage:
  scratch:
    size: 50Gi

head:
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { cpu: "1", memory: 4Gi }

workerGroups:
  - name: cpu
    replicas: 0
    minReplicas: 0
    maxReplicas: 4
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "2", memory: 8Gi }
    nodeSelector:
      workload: ml-cpu
    tolerations: []
  - name: gpu
    replicas: 0
    minReplicas: 0
    maxReplicas: 1
    resources:
      requests: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
    nodeSelector:
      workload: ml-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
