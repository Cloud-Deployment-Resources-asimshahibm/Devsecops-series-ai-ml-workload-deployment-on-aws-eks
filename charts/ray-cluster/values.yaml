clusterName: ml-ray
rayVersion: "2.40.0"

image:
  repository: __AWS_ACCOUNT_ID__.dkr.ecr.us-east-1.amazonaws.com/aiml/ml-ray
  tag: "bootstrap"    # bumped by CI
  digest: ""          # sha256:... (signed) — preferred when set

serviceAccount:
  name: ray-worker
  roleArn: ""         # IRSA <project>-<env>-ml-training (S3 data + artifacts)

storage:
  # Shared RWX scratch on EFS for checkpoints / datasets
  scratch:
    enabled: true
    size: 100Gi
    storageClass: efs-sc

head:
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "2", memory: 8Gi }
  nodeSelector:
    workload: ml-cpu

workerGroups:
  - name: cpu
    replicas: 0
    minReplicas: 0
    maxReplicas: 8
    resources:
      requests: { cpu: "4", memory: 16Gi }
      limits: { cpu: "4", memory: 16Gi }
    nodeSelector:
      workload: ml-cpu
    tolerations: []
  - name: gpu
    replicas: 0
    minReplicas: 0
    maxReplicas: 2
    resources:
      requests: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
    nodeSelector:
      workload: ml-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

autoscaler:
  idleTimeoutSeconds: 120
  upscalingMode: Default
