  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::__AWS_ACCOUNT_ID__:role/aiml-prod-argo-workflows
  # authModes: ["sso"]   # enable with your IdP before exposing the UI

artifactRepository:
