# Falco — runtime threat detection (eBPF), events -> Falcosidekick -> Alertmanager + Loki
driver:
  kind: modern_ebpf

tolerations:
  - operator: Exists          # every node, incl. GPU nodes

collectors:
  kubernetes:
    enabled: true

falco:
  json_output: true
  priority: notice
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/rules.d

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

metrics:
  enabled: true
serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack

customRules:
  ml-platform-rules.yaml: |-
    - list: ml_namespaces
      items: [ml-serving, ml-training, ray]

    - list: miner_binaries
      items: [xmrig, minerd, ethminer, t-rex, nbminer, lolminer, gminer, phoenixminer]

    - macro: in_ml_namespace
      condition: (k8s.ns.name in (ml_namespaces))

    - rule: Shell spawned in model-serving container
      desc: An interactive shell started inside an ml-serving pod (possible RCE / hands-on-keyboard).
      condition: spawned_process and container and k8s.ns.name = "ml-serving" and proc.name in (shell_binaries)
      output: >-
        Shell in ml-serving (user=%user.name cmd=%proc.cmdline pod=%k8s.pod.name
        image=%container.image.repository parent=%proc.pname)
      priority: WARNING
      tags: [ml, container, mitre_execution]

    - rule: Cryptominer started in ML namespace
      desc: Known mining binary or stratum URL on ML compute (GPU abuse).
      condition: >-
        spawned_process and container and in_ml_namespace and
        (proc.name in (miner_binaries) or proc.cmdline contains "stratum+tcp" or proc.cmdline contains "stratum+ssl")
      output: Possible cryptominer (cmd=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
      priority: CRITICAL
      tags: [ml, mitre_impact]

    - rule: Service account token read by unexpected process in ML namespace
      desc: Credential access attempt — only the app runtime should read the projected token.
      condition: >-
        open_read and container and in_ml_namespace and
        fd.name startswith /var/run/secrets/ and
        not proc.name in (python, python3, uvicorn, argoexec, raylet, gcs_server, ray, dashboard)
      output: SA token read (proc=%proc.name cmd=%proc.cmdline file=%fd.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [ml, mitre_credential_access]

    - rule: Package manager executed in running ML container
      desc: Runtime package installs break immutability (drift) and are a common persistence step.
      condition: spawned_process and container and in_ml_namespace and proc.name in (pip, pip3, apt, apt-get, apk, yum, dnf, conda)
      output: Package manager in running container (cmd=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [ml, mitre_persistence]

falcosidekick:
  enabled: true
  replicaCount: 2
  config:
    alertmanager:
      hostport: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
      minimumpriority: warning
    loki:
      hostport: http://loki-gateway.monitoring.svc
      minimumpriority: notice
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  webui:
    enabled: false
