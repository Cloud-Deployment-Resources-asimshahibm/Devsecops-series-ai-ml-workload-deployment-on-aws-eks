name: Build & Deploy (dev)

# Build once, deploy everywhere:
#  1. build ml-inference, ml-training, ml-ray images (tag = git sha, immutable)
#  2. Trivy scan — CRITICAL vulns fail the build
#  3. push to ECR, attach SBOM + provenance
#  4. GitOps: bump image tags in values-dev.yaml and commit -> Argo CD syncs dev
on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/build-and-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write     # commit the tag bump

env:
  AWS_REGION: us-east-1
  ECR_PREFIX: aiml

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: ml-inference
            dockerfile: ml/inference/Dockerfile
          - image: ml-training
            dockerfile: ml/training/Dockerfile
          - image: ml-ray
            dockerfile: ml/training/Dockerfile.ray
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_CI }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ml
          file: ${{ matrix.dockerfile }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Push with SBOM + provenance
        uses: docker/build-push-action@v6
        with:
          context: ml
          file: ${{ matrix.dockerfile }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump image tags in dev values (GitOps)
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' charts/ml-inference/values-dev.yaml
          yq -i '.images.training.tag = strenv(TAG) | .images.ray.tag = strenv(TAG)' charts/ml-pipelines/values-dev.yaml
          yq -i '.image.tag = strenv(TAG)' charts/ray-cluster/values-dev.yaml
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/*/values-dev.yaml
          git commit -m "deploy(dev): ml images ${{ needs.build.outputs.tag }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Summary
        run: |
          {
            echo "### Deployed to dev"
            echo "Image tag: \`${{ needs.build.outputs.tag }}\`"
            echo "Argo CD will sync \`ml-inference\`, \`ml-pipelines\`, \`ray-cluster\` within ~2 minutes."
          } >> "$GITHUB_STEP_SUMMARY"
