name: Terraform

# PR  -> plan for dev + prod with the read-only role, plan posted as PR comment
# main -> apply dev automatically (GitHub Environment "dev")
# manual dispatch -> apply prod (GitHub Environment "prod" with required reviewers)
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write        # OIDC -> AWS
  contents: read
  pull-requests: write   # plan comment

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: terraform/stack
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_PLAN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -backend-config=../envs/${{ matrix.env }}/backend.hcl -lock=false
      - id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color -var-file=../envs/${{ matrix.env }}/terraform.tfvars -out=tfplan -detailed-exitcode > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 1 ] && exit 1 || exit 0
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/stack/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = `### Terraform plan — \`${{ matrix.env }}\`\n<details><summary>show</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    if: github.event_name != 'pull_request'
    name: Apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}   # prod environment requires approval
    concurrency:
      group: terraform-${{ github.event.inputs.environment || 'dev' }}
      cancel-in-progress: false
    timeout-minutes: 90
    defaults:
      run:
        working-directory: terraform/stack
    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_APPLY }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - run: terraform init -backend-config=../envs/$ENV/backend.hcl
      - run: terraform plan -var-file=../envs/$ENV/terraform.tfvars -out=tfplan
      - run: terraform apply -auto-approve tfplan
      - name: Outputs
        run: terraform output -json | jq 'del(.. | .sensitive? // empty)' > outputs.json && cat outputs.json
