name: CI

# Runs on every PR and push: fast feedback, no cloud credentials needed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check . || echo "::warning::run 'ruff format ml' locally"
      - run: pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: ml/pytest.xml

  terraform:
    name: Terraform fmt + validate + tflint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform/global, terraform/stack]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: fmt
        run: terraform fmt -check -recursive -diff terraform
      - name: validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: ${{ matrix.dir }}
        run: |
          tflint --init
          tflint --recursive --format compact

  helm:
    name: Helm lint + render + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate every chart for every env
        run: |
          set -euo pipefail
          for chart in charts/* argocd/app-of-apps; do
            for env in dev prod; do
              echo "::group::$chart ($env)"
              helm lint "$chart" -f "$chart/values.yaml" -f "$chart/values-$env.yaml"
              helm template t "$chart" -f "$chart/values.yaml" -f "$chart/values-$env.yaml" \
                | kubeconform -strict -summary -ignore-missing-schemas \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done
      - name: Kustomize render
        run: kubectl kustomize observability/extras > /dev/null
      - name: Validate dashboards are valid JSON
        run: for f in observability/extras/dashboards/*.json; do jq empty "$f"; done

  security:
    name: Security scans (IaC + deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (Terraform, k8s, Dockerfiles)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,dockerfile,github_actions
          soft_fail: true            # report only; tighten once baseline is triaged
          output_format: sarif
          output_file_path: checkov.sarif
      - name: Trivy filesystem scan (dependencies, secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
